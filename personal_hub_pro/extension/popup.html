<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Hub Pro</title><link rel="stylesheet" href="popup.css"></head><body><header><div class="logo">P</div><div><strong>Personal Hub Pro</strong><small>Your private records</small></div></header>
<div id="status" class="status">Loading…</div>
<section id="login-view" hidden><h2>Sign in</h2><form id="login-form"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="primary">Sign in</button></form><p class="hint">Create your account on the website first.</p><button id="open-site" class="secondary">Open website</button></section>
<section id="records-view" hidden><div class="userrow"><span id="user-email"></span><button id="logout" class="link">Sign out</button></div><form id="add-form"><h2>Add record</h2><label>Full name<input id="full_name" required maxlength="120"></label><label>Email<input id="record-email" type="email" maxlength="254"></label><label>Phone<input id="phone" maxlength="40"></label><label>Category<select id="category"><option>Personal</option><option>Family</option><option>Work</option><option>Education</option><option>Other</option></select></label><label>City<input id="city" maxlength="100"></label><label>Notes<textarea id="notes" maxlength="2000" rows="2"></textarea></label><button class="primary">Save record</button></form><h2>Your records</h2><div id="records"></div><button id="open-dashboard" class="secondary">Open full dashboard</button></section>
<script src="popup.js"></script></body></html>
